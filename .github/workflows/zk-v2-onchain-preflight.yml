name: DEVNIRA actual FRAME V2 22-PI on-chain chain-state guard (NO MINT)
on:
  pull_request:
    paths:
      - scripts/patch_zk_v2_onchain_preflight.py
      - tests/test_zk_v2_onchain_preflight.py
      - .github/workflows/zk-v2-onchain-preflight.yml
      - config/upstream-pins.json
  push:
    branches: [main]
    paths:
      - scripts/patch_zk_v2_onchain_preflight.py
      - tests/test_zk_v2_onchain_preflight.py
      - .github/workflows/zk-v2-onchain-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-frame-onchain-state-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify source fail-closed gating
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_zk_v2_onchain_preflight.py' -v
          python3 -m py_compile scripts/patch_zk_v2_onchain_preflight.py
      - name: Fetch exact pinned chain AND canonical 22-PI proof layouts
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/chain.git upstream
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["upstream_chain"]["sha"])')
          git -C upstream fetch --depth 1 origin "$PIN"
          git -C upstream checkout --detach "$PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          ZPIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$ZPIN"
          git -C zk-circuits checkout --detach "$ZPIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$ZPIN"
      - name: Insert non-dispatchable storage guard into real FRAME wormhole
        run: |
          python3 scripts/patch_zk_v2_onchain_preflight.py upstream --circuit-source zk-circuits
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Real FRAME replay, history, 22-PI and issuance-invariance tests
        working-directory: upstream
        run: cargo +1.93.0 test --locked -p pallet-wormhole --lib dvn_v2_abi_ -- --nocapture
      - name: Warn against activating unverified settlement
        run: |
          echo 'Real FRAME 22-PI chain-state preflight tested, but this helper is NOT a dispatchable, a cryptographic verifier, or a payout. It neither authenticates historical Merkle roots nor authorizes new DVN. Full Stage 2 remains blocked.' >> "$GITHUB_STEP_SUMMARY"
