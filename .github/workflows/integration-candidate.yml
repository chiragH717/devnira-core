name: DEVNIRA upstream integration candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream
        run: git clone --depth 1 https://github.com/Quantus-Network/chain.git upstream
      - name: Record upstream commit
        run: git -C upstream rev-parse HEAD | tee upstream-commit.txt
      - name: Apply isolated DEVNIRA local chain-spec changes
        run: python3 scripts/prepare_upstream.py upstream
      - name: Assert isolation identifiers
        run: |
          grep -q 'with_id("devnira-local")' upstream/node/src/chain_spec.rs
          grep -q 'with_protocol_id("devnira-local-v1")' upstream/node/src/chain_spec.rs
      - name: Install upstream pinned Rust toolchain
        run: |
          cat upstream/rust-toolchain
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32v1-none --toolchain 1.93.0
      - name: Install LLVM libclang dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev cmake build-essential
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Preflight native build dependencies
        run: |
          set -euo pipefail
          command -v protoc
          protoc --version
          command -v clang
          clang --version | head -n 1
          test -f "$LIBCLANG_PATH/libclang.so" || ldconfig -p | grep -q 'libclang.so'
          pkg-config --version
          cmake --version | head -n 1
          rustc +1.93.0 --version
          cargo +1.93.0 --version
      - name: Compile patched upstream candidate
        working-directory: upstream
        run: cargo +1.93.0 build --release -p quantus-node
      - name: Print candidate chain spec
        run: |
          upstream/target/release/quantus-node build-spec --dev --disable-default-bootnode > devnira-local-candidate.json
          python3 -m json.tool devnira-local-candidate.json >/dev/null
      - name: Smoke-test compiled candidate node and genesis RPC
        shell: bash
        run: |
          set -euo pipefail
          upstream/target/release/quantus-node --dev --tmp --rpc-port 9944 --rpc-methods Unsafe > candidate-node.log 2>&1 &
          NODE_PID=$!
          trap 'kill "$NODE_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, time, urllib.request
          url = "http://127.0.0.1:9944"
          for attempt in range(60):
              try:
                  body = json.dumps({"jsonrpc":"2.0","id":1,"method":"chain_getBlockHash","params":[0]}).encode()
                  req = urllib.request.Request(url, body, {"Content-Type":"application/json"})
                  with urllib.request.urlopen(req, timeout=3) as response:
                      data = json.load(response)
                  value = data.get("result")
                  if isinstance(value, str) and value.startswith("0x") and len(value) == 66:
                      open("candidate-genesis-hash.txt","w").write(value + "\\n")
                      print("UPSTREAM-RUNTIME DEV CANDIDATE genesis:", value)
                      break
              except Exception as exc:
                  print(f"RPC not ready ({attempt+1}/60): {exc}")
              time.sleep(2)
          else:
              raise SystemExit("Candidate node did not expose a valid genesis hash over RPC")
          PY
      - name: Upload chain spec candidate
        uses: actions/upload-artifact@v4
        with:
          name: devnira-local-chain-spec-candidate
          path: |
            upstream-commit.txt
            devnira-local-candidate.json
            candidate-genesis-hash.txt
            candidate-node.log
          if-no-files-found: error
