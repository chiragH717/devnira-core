name: DEVNIRA V2 recursive Poseidon2 proof candidate
on:
  push:
    branches: [main]
    paths:
      - scripts/patch_zk_v2_recursive_candidate.py
      - tests/test_zk_v2_recursive_candidate.py
      - scripts/patch_zk_v2_aggregation_amounts.py
      - scripts/patch_zk_leaf_amount_v2.py
      - scripts/patch_zk_native_conservation.py
      - config/upstream-pins.json
      - .github/workflows/zk-v2-recursive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recursive-v2:
    name: Prove real Poseidon2 leaf inside fixed-key recursive Plonky2 verifier
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed source insertion
        run: |
          python3 -m unittest discover -s tests -p 'test_zk_v2_recursive_candidate.py' -v
          python3 -m py_compile scripts/patch_zk_v2_recursive_candidate.py
      - name: Download pinned external proof source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$PIN"
          git -C zk-circuits checkout --detach "$PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$PIN"
          git -C zk-circuits rev-parse HEAD > zk-v2-recursive-source-sha.txt
      - name: Stage REAL V2 leaf, native conservation and native-u64 aggregation
        run: |
          python3 scripts/patch_zk_leaf_amount_v2.py zk-circuits
          python3 scripts/patch_zk_native_conservation.py zk-circuits
          python3 scripts/patch_zk_v2_aggregation_amounts.py zk-circuits
      - name: Add fixed-inner-VK recursive proof candidate
        run: python3 scripts/patch_zk_v2_recursive_candidate.py zk-circuits
      - name: Install audited Rust 1.93.0
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Build, PROVE and VERIFY recursive V2 leaf and reject tampered payout/fee
        working-directory: zk-circuits
        env:
          DEVNIRA_TEST_ARTIFACT_DIR: ${{ github.workspace }}/dvn-v2-verifier-candidate
        run: cargo +1.93.0 test --locked -p qp-wormhole-aggregator --lib dvn_v2_actual_recursive_ -- --nocapture
      - name: Hash development-only V2 leaf and fixed-key recursive verifier artifacts
        run: |
          set -euo pipefail
          ls -lh dvn-v2-verifier-candidate/
          test -s dvn-v2-verifier-candidate/v2-leaf-verifier.bin
          test -s dvn-v2-verifier-candidate/v2-leaf-common.bin
          test -s dvn-v2-verifier-candidate/v2-recursive-verifier.bin
          test -s dvn-v2-verifier-candidate/v2-recursive-common.bin
          sha256sum dvn-v2-verifier-candidate/*.bin | tee dvn-v2-verifier-candidate/SHA256SUMS
          echo 'Development V2 verifier key hashes generated from identical pinned sources; NOT the active on-chain verifier.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PUBLIC-only DEVELOPMENT leaf and recursive verifier artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DEVNIRA-V2-RECURSIVE-PUBLIC-VERIFIER-KEYS-NOT-MAINNET
          path: dvn-v2-verifier-candidate/
          if-no-files-found: error
      - name: Reject foreign V1 activation
        run: |
          set -euo pipefail
          grep -q 'pub mod devnira_v2_recursive_candidate;' zk-circuits/wormhole/aggregator/src/lib.rs
          grep -q 'builder.range_check(final_sum, 32)' zk-circuits/wormhole/aggregator/src/private_batch/circuit/circuit_logic.rs
          {
            echo '## Real Poseidon2 V2 leaf to fixed-key recursive Plonky2 proof: development candidate'
            echo 'A cryptographic V2 leaf proof is checked recursively against a pinned inner circuit key.'
            echo 'NOT proof of full private/public batch V2 activation, nullifier settlement, independent DVN runtime/genesis or mainnet.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pinned external proof-source revision
        uses: actions/upload-artifact@v4
        with:
          name: devnira-real-v2-recursive-prover-test-NOT-MAINNET
          path: zk-v2-recursive-source-sha.txt
          if-no-files-found: error
