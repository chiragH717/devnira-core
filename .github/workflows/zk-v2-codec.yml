name: DEVNIRA ZK V2 codec integration candidate
on:
  push:
    branches: [main]
    paths:
      - scripts/patch_zk_amount_v2.py
      - scripts/audit_zk_migration.py
      - tests/test_audit_zk_migration.py
      - tests/test_patch_zk_amount_v2.py
      - .github/workflows/zk-v2-codec.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zk-amount-codec:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check Python patch and reference test
        run: |
          python3 -m py_compile scripts/patch_zk_amount_v2.py
          python3 -m unittest discover -s tests -p 'test_patch_zk_amount_v2.py' -v
          python3 -m unittest discover -s tests -p 'test_zk_amount_v2.py' -v
      - name: Clone upstream and identify source
        run: |
          git clone --depth 1 https://github.com/Quantus-Network/chain.git upstream
          git -C upstream rev-parse HEAD
      - name: Inject strict 8-decimal amount reference codec into FRAME ZK-tree
        run: python3 scripts/patch_zk_amount_v2.py upstream
      - name: Audit all ZK V1 proof and runtime migration blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_audit_zk_migration.py' -v
          if python3 scripts/audit_zk_migration.py upstream > zk-migration-report.txt 2>&1; then
            echo "Unexpected production readiness result; review source audit"
            exit 1
          fi
          cat zk-migration-report.txt
          grep -q 'ZK-tree still' zk-migration-report.txt
          grep -q 'Wormhole still' zk-migration-report.txt
          grep -q 'qp-wormhole-verifier remains upstream V1' zk-migration-report.txt
          echo "PASS: V1 incompatibilities correctly block production release"
      - name: Install Rust toolchain and native dependencies
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev cmake build-essential
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Compile and test DVN codec module in actual ZK-tree pallet
        working-directory: upstream
        run: |
          cargo +1.93.0 test --locked -p pallet-zk-tree --lib dvn_native_felt_roundtrip -- --nocapture
          cargo +1.93.0 test --locked -p pallet-zk-tree --lib dvn_rejects_out_of_range_amounts -- --nocapture
      - name: Verify upstream leaf format remains unchanged — NOT PRODUCTION MIGRATION
        run: |
          grep -q 'pub const AMOUNT_SCALE_DOWN_FACTOR: u128 = 10_000_000_000' upstream/pallets/zk-tree/src/tree.rs
          echo "PASS: codec compiles, but leaf hashing/verifier remain V1. Do not release."
