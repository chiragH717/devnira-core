name: DEVNIRA four-component integration build
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  zk-proof:
    name: ZK source codec and proof-stack candidate
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Audit local ZK sources and codec tests
        run: |
          python3 -m unittest discover -s tests -p 'test_zk*.py' -v
          python3 -m unittest discover -s tests -p 'test_patch_zk_amount_v2.py' -v
          python3 -m unittest discover -s tests -p 'test_audit_zk_migration.py' -v
      - name: Clone ZK proof source
        run: |
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$PIN"
          git -C zk-circuits checkout --detach "$PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$PIN"
          git -C zk-circuits rev-parse HEAD | tee zk-revision.txt
      - name: Apply native DVN u64 input prototype
        run: python3 scripts/patch_zk_proof_inputs_v2.py zk-circuits
      - name: Inject V2 native amount constraint gadget in actual Plonky2 source
        run: python3 scripts/patch_zk_leaf_amount_v2.py zk-circuits
      - name: Bind V2 Plonky2 leaf proof to the same native FRAME Poseidon2 hash
        run: python3 scripts/patch_zk_native_hash_golden.py zk-circuits
      - name: Enforce native 8-decimal ZK value conservation and fee budget
        run: python3 scripts/patch_zk_native_conservation.py zk-circuits
      - name: Run V2 circuit proof/verify tests including over-supply rejection
        working-directory: zk-circuits
        run: cargo test -p qp-wormhole-circuit --lib dvn_ -- --nocapture
      - name: Compile real input codec tests
        working-directory: zk-circuits
        run: cargo test -p qp-wormhole-inputs --lib dvn_v2 -- --nocapture
      - name: Mark proof status accurately
        run: |
          echo 'ZK proof inputs compiled, but Poseidon2 leaf, aggregator, prover, verifier and on-chain proof are still V1.' >> "$GITHUB_STEP_SUMMARY"

  runtime-genesis:
    name: Reward, vesting and node native/WASM development candidate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Test tokenomics and genesis calculations
        run: |
          python3 -m unittest discover -s tests -v
          cargo test --manifest-path rust/tokenomics/Cargo.toml
      - name: Validate independent DVN genesis funding and vesting constraints
        run: |
          python3 -m unittest discover -s tests -p 'test_actual_genesis_audit.py' -v
          echo "Production genesis: BLOCKED until authenticated company address, actual chain spec and vesting pot ED funding are solved" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate single company founder allocation policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from spec.genesis_allocations import INSTANT_BUDGET, VESTED_BUDGET
          p = json.loads(Path('config/genesis-proposal.json').read_text())
          c = p['company_treasury']
          assert c['policy'] == 'single_company_controlled_public_account'
          assert c['public_address'] is None, "A company wallet must not be fabricated"
          assert c['instant_units'] == INSTANT_BUDGET
          assert c['locked_units'] == VESTED_BUDGET
          assert c['monthly_unlock_count'] == 12
          assert p['mining_allocation_units'] == 90_000_000 * 100_000_000
          assert p['max_supply_units'] == 100_000_000 * 100_000_000
          print("PASS: Single-company allocation policy. Production genesis still blocked.")
          PY
      - name: Checkout exact upstream source
        run: |
          git clone --depth 1 https://github.com/Quantus-Network/chain.git upstream
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["upstream_chain"]["sha"])')
          git -C upstream fetch --depth 1 origin "$PIN"
          git -C upstream checkout --detach "$PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
          git -C upstream rev-parse HEAD | tee chain-revision.txt
      - name: Apply candidate rewards and protected monthly vesting
        run: |
          python3 scripts/patch_reward_runtime.py upstream
          python3 scripts/test_reward_runtime.py upstream
          python3 scripts/protect_genesis_vesting.py upstream
          python3 scripts/patch_exact_genesis_vesting.py upstream
          python3 scripts/patch_dvn_wallet_cli.py upstream
          python3 scripts/patch_dvn_custody_signing.py upstream
          python3 scripts/patch_zk_tree_native_v2.py upstream
          python3 scripts/test_exact_genesis_vesting.py upstream
          python3 scripts/test_genesis_vesting_protection.py upstream
          python3 scripts/test_onchain_vesting.py upstream
      - name: Install runtime build dependencies
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32v1-none --toolchain 1.93.0
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev cmake build-essential
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Confirm 8-decimal DEVNIRA runtime cannot mix with old ZK proof format
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_patch_dvn_runtime_units.py' -v
          if python3 scripts/patch_dvn_runtime_units.py upstream > /tmp/dvn-runtime-migration.txt 2>&1; then
            echo "ERROR: unsafe migration unexpectedly succeeded against upstream V1" >&2
            exit 1
          fi
          cat /tmp/dvn-runtime-migration.txt
          grep -q 'STOP: ZK tree still uses V1' /tmp/dvn-runtime-migration.txt
          echo 'Release blocked: 8-decimal runtime must wait for matching active ZK proof system.' >> "$GITHUB_STEP_SUMMARY"
      - name: FRAME consensus accounting and vesting tests
        working-directory: upstream
        run: |
          cargo +1.93.0 test --locked -p pallet-mining-rewards --lib dvn_ -- --nocapture
          cargo +1.93.0 test --locked -p pallet-vesting --lib dvn_ -- --nocapture
          cargo +1.93.0 test --locked -p pallet-vesting --lib dvn_exact_pot_ -- --nocapture
          cargo +1.93.0 test --locked -p pallet-zk-tree --lib dvn_native_v2_ -- --nocapture
      - name: Native and embedded WASM compile
        working-directory: upstream
        run: cargo +1.93.0 build --release --locked -p quantus-node
      - name: Test actual DEVNIRA Dilithium wallet recovery with public TEST mnemonic
        run: |
          set -euo pipefail
          # Published test-only mnemonic: never use for company custody.
          printf '%s\n' 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' |
            upstream/target/release/quantus-node key devnira --scheme standard --words --wallet-index 0 --verbose > dvn-public-cli.txt
          python3 scripts/check_dvn_cli_address.py dvn-public-cli.txt
      - name: Sign and verify a real 24-hour company address-bound TEST challenge
        run: |
          set -euo pipefail
          # This is a PUBLISHED test-only recovery phrase, not a company secret.
          # Native devnira-sign reads stdin; --message contains no secret.
          addr=$(sed -n 's/^Address: //p' dvn-public-cli.txt | head -1)
          pub=$(sed -n 's/^Pub key: //p' dvn-public-cli.txt | head -1)
          test -n "$addr"
          test -n "$pub"
          python3 scripts/prepare_company_genesis_custody.py challenge \
            --company-public-address "$addr" --output devnira-public-test-challenge.json
          msg=$(python3 -c 'import json;print(json.load(open("devnira-public-test-challenge.json"))["message"])')
          output=$(printf '%s\n' 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' |
            upstream/target/release/quantus-node key devnira-sign --message "$msg" --wallet-index 0)
          sig="${output#Signature: }"
          test "$sig" != "$output"
          upstream/target/release/quantus-node key devnira-verify \
            --signature "$sig" --public-key "$pub" --message "$msg" --expected-address "$addr"
          if upstream/target/release/quantus-node key devnira-verify \
            --signature "$sig" --public-key "$pub" --message "$msg|tampered" --expected-address "$addr"; then
            echo 'FAIL: edited ownership challenge incorrectly verified' >&2
            exit 1
          fi
          if upstream/target/release/quantus-node key devnira-verify \
            --signature "$sig" --public-key "$pub" --message "$msg" --expected-address wrong-address; then
            echo 'FAIL: wrong beneficiary address incorrectly verified' >&2
            exit 1
          fi
          PUBLIC_KEY="$pub" PUBLIC_SIGNATURE="$sig" python3 - <<'PY'
          import json, os
          with open("devnira-public-test-challenge.json",encoding="utf-8") as f:
              cert=json.load(f)
          cert["public_key_hex"]=os.environ["PUBLIC_KEY"]
          cert["signature_hex"]=os.environ["PUBLIC_SIGNATURE"]
          with open("devnira-public-test-certificate.json","w",encoding="utf-8") as f:
              json.dump(cert,f)
          PY
          sha=$(sha256sum upstream/target/release/quantus-node | cut -d ' ' -f1)
          launch=$(python3 -c 'from datetime import datetime,timedelta,timezone;print((datetime.now(timezone.utc)+timedelta(days=30)).strftime("%Y-%m-%dT%H:%M:%S+00:00"))')
          python3 scripts/prepare_company_genesis_custody.py manifest \
            --signed-public-certificate devnira-public-test-certificate.json \
            --trusted-node-binary upstream/target/release/quantus-node \
            --trusted-node-sha256 "$sha" --genesis-utc "$launch" \
            --output devnira-public-test-offchain-genesis-plan.json
          python3 - <<'PY'
          import json
          from spec.genesis_allocations import INSTANT_BUDGET,VESTED_BUDGET
          p=json.load(open("devnira-public-test-offchain-genesis-plan.json"))
          assert p["production_genesis"] is False
          assert p["company_address_verified"] is True
          assert p["instant_total_units"] == INSTANT_BUDGET
          assert p["locked_total_units"] == VESTED_BUDGET
          assert len(p["monthly_unlocks"]) == 12
          assert sum(x["amount_units"] for x in p["monthly_unlocks"]) == VESTED_BUDGET
          print("PASS: actual native ML-DSA-87 signer, account+signature verification and 3M/7M public TEST custody manifest")
          PY
          echo 'PASS: real DVN native wallet signs/validates address-bound public TEST challenge, with independent SHA256-pinned Python verifier.' >> "$GITHUB_STEP_SUMMARY"
      - name: Reject unattended generation of company wallet secrets
        run: |
          set -euo pipefail
          if upstream/target/release/quantus-node key devnira --scheme standard > /tmp/unattended-key.out 2>&1; then
            echo 'ERROR: unattended key generation should be rejected' >&2
            exit 1
          fi
          grep -q 'requires a local interactive terminal' /tmp/unattended-key.out
      - name: Record development genesis candidate (NOT DEVNIRA mainnet)
        run: |
          upstream/target/release/quantus-node build-spec --dev --disable-default-bootnode > dev-chain-spec.json
          python3 -m json.tool dev-chain-spec.json >/dev/null
          echo 'This is an upstream 12-decimal development chain, NOT DVN independent genesis.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact upstream dev revision
        uses: actions/upload-artifact@v4
        with:
          name: dvn-dev-runtime-evidence-not-mainnet
          path: |
            chain-revision.txt
            dev-chain-spec.json
          if-no-files-found: error

  windows-wallet:
    name: Windows DVN receive and finalized balance preview (NOT signing)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test safe local-RPC and pinned network identity prerequisites
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_network_identity.py" -v
          python -m unittest discover -s tests -p "test_wallet_balance.py" -v
          python -m unittest discover -s tests -p "test_ss58_company_account.py" -v
          python -m py_compile wallet/network_identity.py wallet/devnira_balance.py
      - name: Validate SS58 receive address and finalized account-balance Windows UI
        shell: pwsh
        run: python -m py_compile wallet/devnira_windows.py wallet/devnira_rpc.py
      - name: Build Windows pre-release diagnostic executable
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --onefile --windowed --name DEVNIRA-Wallet-Preview-ReadOnly wallet/devnira_windows.py
      - name: Upload unsigned read-only wallet preview, NOT a signing wallet
        uses: actions/upload-artifact@v4
        with:
          name: DVN-Windows-Receive-Balance-NOT-SIGNING-WALLET
          path: dist/DEVNIRA-Wallet-Preview-ReadOnly.exe
          if-no-files-found: error

  gpu-testnet:
    name: GPU mining testnet prerequisite audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mining formula and protocol reference
        run: |
          python3 -m unittest discover -s tests -p 'test_tokenomics.py' -v
          cargo test --manifest-path rust/tokenomics/Cargo.toml
      - name: Verify two-node finalized chain test rejects wrong genesis and forks
        run: |
          python3 -m unittest discover -s tests -p 'test_two_node_rpc.py' -v
          python3 -m py_compile scripts/test_two_node_rpc.py
      - name: State GPU hardware proof not performed on CI CPU runner
        run: |
          echo 'No NVIDIA or AMD device is attached to this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Two-node sync, actual GPU PoW proofs, network reorg and miner pool compatibility remain UNTESTED.' >> "$GITHUB_STEP_SUMMARY"

  candidate-summary:
    name: Development candidate summary (NOT mainnet approval)
    runs-on: ubuntu-latest
    needs: [zk-proof, runtime-genesis, windows-wallet, gpu-testnet]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Require all four development candidate jobs to pass
        env:
          ZK: ${{ needs.zk-proof.result }}
          RUNTIME: ${{ needs.runtime-genesis.result }}
          WINDOWS: ${{ needs.windows-wallet.result }}
          GPU: ${{ needs.gpu-testnet.result }}
        run: |
          set -euo pipefail
          echo "Development candidate jobs: ZK=$ZK runtime=$RUNTIME Windows=$WINDOWS GPU=$GPU"
          test "$ZK" = success
          test "$RUNTIME" = success
          test "$WINDOWS" = success
          test "$GPU" = success
      - name: Show production blockers without mislabeling successful candidate CI as failed
        run: |
          set -euo pipefail
          echo '{}' > evidence.json
          if python3 scripts/release_evidence_gate.py evidence.json > production-blockers.txt 2>&1; then
            echo "Unexpected: blank evidence met production gate" >&2
            exit 1
          fi
          cat production-blockers.txt
          grep -q 'NOT RELEASE READY:' production-blockers.txt
          {
            echo "## DEVNIRA development candidate: PASS"
            echo "The four development jobs passed. This **is not** a mainnet approval."
            echo
            echo "## Production: BLOCKED"
            echo "Windows pre-release client now has pinned receive and finalized balance reading, but actual active V2 proofs, independent 8-decimal genesis, signed transfers and NVIDIA/AMD GPU mining tests are NOT evidenced."
            echo
            echo "The production-release workflow remains **fail-closed** and must reject missing evidence."
            echo
            echo "### Missing production evidence"
            sed -n '/^BLOCKED:/p' production-blockers.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production blocker report
        uses: actions/upload-artifact@v4
        with:
          name: devnira-production-blockers-not-mainnet-ready
          path: production-blockers.txt
          if-no-files-found: error
