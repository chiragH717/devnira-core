name: DEVNIRA authenticated depth-16 22PI fixed-key recursive integration (NOT SETTLEMENT)
on:
  pull_request:
    paths:
      - scripts/patch_zk_v2_authenticated_recursive_22pi.py
      - scripts/patch_zk_v2_real_proof_frame_bridge.py
      - tests/test_zk_v2_authenticated_recursive_22pi.py
      - tests/test_zk_v2_real_proof_frame_bridge.py
      - config/dvn-v2-authenticated-recursive-abi.json
      - .github/workflows/stage2-authenticated-recursive-22pi.yml
      - config/upstream-pins.json
  push:
    branches: [main]
    paths:
      - scripts/patch_zk_v2_authenticated_recursive_22pi.py
      - scripts/patch_zk_v2_real_proof_frame_bridge.py
      - tests/test_zk_v2_authenticated_recursive_22pi.py
      - tests/test_zk_v2_real_proof_frame_bridge.py
      - config/dvn-v2-authenticated-recursive-abi.json
      - .github/workflows/stage2-authenticated-recursive-22pi.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-native-plonky2-authenticated-recursion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed chained source migration and development ABI
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_zk_v2_authenticated_recursive_22pi.py' -v
          python3 -m unittest discover -s tests -p 'test_zk_v2_real_proof_frame_bridge.py' -v
          python3 -m py_compile scripts/patch_zk_v2_authenticated_recursive_22pi.py
          python3 - <<'PY'
          import json
          v=json.load(open("config/dvn-v2-authenticated-recursive-abi.json"))
          assert v["leaf_public_inputs"] == 22
          assert v["proof_depth"] == 16
          assert v["max_tested_batch_leaves"] == 2
          assert v["production_verifier_key_sha256"] is None
          assert v["on_chain_settlement_enabled"] is False
          print("Fail-closed: no production verifier key, settlement NOT enabled")
          PY
      - name: Fetch exact pinned native Plonky2 source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$PIN"
          git -C zk-circuits checkout --detach "$PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$PIN"
      - name: Apply SAME 22PI native secret plus 16-level Merkle plus fixed VK recursion
        run: |
          set -euo pipefail
          python3 scripts/patch_zk_leaf_amount_v2.py zk-circuits
          python3 scripts/patch_zk_native_conservation.py zk-circuits
          python3 scripts/patch_zk_v2_authentic_22pi_leaf.py zk-circuits
          python3 scripts/patch_zk_v2_multilevel_authentic_22pi.py zk-circuits
          python3 scripts/patch_zk_v2_authenticated_full_depth_16.py zk-circuits
          python3 scripts/patch_zk_v2_authenticated_recursive_22pi.py zk-circuits
          git -C zk-circuits diff --stat
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Real native Plonky2 full-depth fixed-key recursive proof, 2-leaf uniqueness and foreign key rejection
        working-directory: zk-circuits
        run: |
          set -euo pipefail
          # Cargo runs test binaries with CARGO_MANIFEST_DIR as cwd; use an
          # absolute directory so both proof tests and workflow agree.
          export DEVNIRA_TEST_ARTIFACT_DIR="$PWD/dvn-v2-development-verifier-artifacts"
          cargo +1.93.0 test --locked -p qp-wormhole-circuit --lib dvn_v2_recursive22_ -- --nocapture
          ls -lah "$DEVNIRA_TEST_ARTIFACT_DIR"
          test -s dvn-v2-development-verifier-artifacts/authenticated-22pi-real-leaf-pis.txt
          test -s dvn-v2-development-verifier-artifacts/authenticated-22pi-inner-vk.bin
          test -s dvn-v2-development-verifier-artifacts/authenticated-22pi-recursive-vk.bin
          (cd dvn-v2-development-verifier-artifacts && sha256sum *.bin) | tee dvn-v2-development-verifier-artifacts/SHA256SUMS.txt
      - name: Upload development verifier artifacts, not approved production keys
        uses: actions/upload-artifact@v4
        with:
          name: DEVNIRA-REAL-AUTHENTICATED-22PI-RECURSIVE-DEV-VK-NOT-ONCHAIN
          path: zk-circuits/dvn-v2-development-verifier-artifacts/
          if-no-files-found: error
      - name: State exact remaining production blocker
        run: |
          echo 'PASS (if reached) proves pinned native Plonky2 depth-16 authenticated leaf -> fixed-key recursive proof and two-leaf fee/replay constraints.' >> "$GITHUB_STEP_SUMMARY"
          echo 'BLOCKED: production private/public V2 aggregator, approved VK hash, FRAME native/WASM verifier, atomic state nullifier + balance settlement, spendable genesis, signed Send, mainnet.' >> "$GITHUB_STEP_SUMMARY"
  proof-derived-22pi-native-wasm-frame-storage-bridge:
    needs: [actual-native-plonky2-authenticated-recursion]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download the SAME genuinely proven 22PI leaf public fields
        uses: actions/download-artifact@v4
        with:
          name: DEVNIRA-REAL-AUTHENTICATED-22PI-RECURSIVE-DEV-VK-NOT-ONCHAIN
          path: proven-zk-fixtures/
      - name: Require actual cryptographic proof output; no hand-written frame fixture
        run: |
          set -euo pipefail
          test "$(wc -l < proven-zk-fixtures/authenticated-22pi-real-leaf-pis.txt)" -eq 22
          sha256sum proven-zk-fixtures/authenticated-22pi-real-leaf-pis.txt
          python3 -m unittest discover -s tests -p 'test_zk_v2_real_proof_frame_bridge.py' -v
      - name: Checkout immutable FRAME native/WASM and same pinned ZK source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/chain.git upstream
          CHAIN_PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["upstream_chain"]["sha"])')
          git -C upstream fetch --depth 1 origin "$CHAIN_PIN"
          git -C upstream checkout --detach "$CHAIN_PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$CHAIN_PIN"
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          ZK_PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$ZK_PIN"
          git -C zk-circuits checkout --detach "$ZK_PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$ZK_PIN"
      - name: Patch real inert 8-decimal runtime and FRAME history gate + proof-derived ABI
        run: |
          set -euo pipefail
          python3 scripts/guard_dvn_network_identity.py upstream
          python3 scripts/patch_reward_runtime.py upstream
          python3 scripts/test_reward_runtime.py upstream
          python3 scripts/protect_genesis_vesting.py upstream
          python3 scripts/patch_exact_genesis_vesting.py upstream
          python3 scripts/test_exact_genesis_vesting.py upstream
          python3 scripts/test_genesis_vesting_protection.py upstream
          python3 scripts/test_onchain_vesting.py upstream
          python3 scripts/patch_isolated_dvn_8decimal_runtime.py upstream
          python3 scripts/patch_zk_v2_onchain_preflight.py upstream --circuit-source zk-circuits
          python3 scripts/patch_zk_v2_real_proof_frame_bridge.py upstream
          git -C upstream diff --stat
      - name: Install pinned Rust native plus WASM build dependencies
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32v1-none --toolchain 1.93.0
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev cmake build-essential
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Actual FRAME test consumes cryptographically proven 22PI against history and nullifiers
        working-directory: upstream
        env:
          DEVNIRA_REAL_PROOF_PIS_TXT: ../proven-zk-fixtures/authenticated-22pi-real-leaf-pis.txt
        run: |
          set -euo pipefail
          cargo +1.93.0 test --locked -p pallet-wormhole --lib dvn_real_recursive_proof_abi_ -- --nocapture
      - name: Compile same inert 8-decimal DEVNIRA node and embedded WASM
        working-directory: upstream
        run: cargo +1.93.0 build --locked --release -p quantus-node
      - name: Verify compiled node stays inert, isolated and NOT spendable
        run: |
          set -euo pipefail
          upstream/target/release/quantus-node build-spec --chain dev --disable-default-bootnode > devnira-8dec-inert-proof-frame-bridge.json
          python3 - <<'PY'
          import json
          spec=json.load(open("devnira-8dec-inert-proof-frame-bridge.json"))
          assert spec["id"]=="devnira-8dec-inert-dev"
          assert spec["properties"]["tokenDecimals"]==8
          assert spec["properties"]["ss58Format"]==190
          assert spec["properties"]["tokenSymbol"]=="DVN"
          print("No production V2 proof dispatch, no spend or genesis activation.")
          PY
      - name: Upload real read-only native/WASM ABI bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: DEVNIRA-REAL-22PI-TO-FRAME-NATIVE-WASM-READ-ONLY
          path: devnira-8dec-inert-proof-frame-bridge.json
          if-no-files-found: error
      - name: Prevent false production readiness claims
        run: |
          echo 'A real cryptographically proved 22PI leaf fixture crossed into real FRAME historical-nullifier read-only state check and one inert native/WASM build.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This test mocks the historical BlockHash to the proof output; it does NOT cryptographically verify proof bytes on-chain. No nullifier write, no balance settlement, no real genesis, no active signed transfer, no mainnet.' >> "$GITHUB_STEP_SUMMARY"
