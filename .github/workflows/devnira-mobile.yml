name: Devnira User and Admin APK
on:
  push:
    branches: [codex/devnira-mobile-reference-v02]
    paths: ['apps/devnira/**', '.github/workflows/devnira-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: devnira-mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/devnira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - run: npm ci --prefix backend && npm test --prefix backend
      - run: npm ci --prefix contracts && npm test --prefix contracts
      - uses: actions/upload-artifact@v4
        with:
          name: Devnira-Contract-ABI-Not-Deployed
          path: apps/devnira/contracts/build/DevniraRewards.json
          if-no-files-found: error
  apk:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: player
            target: lib/main.dart
            name: Devnira-User-Demo
          - role: admin
            target: lib/main_admin.dart
            name: Devnira-Admin-Demo
    defaults:
      run:
        working-directory: apps/devnira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build installable demo APK
        run: flutter build apk --release --flavor ${{ matrix.role }} --target ${{ matrix.target }} --dart-define=LIVE=false
      - name: Package explicit demo identity and checksums
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-${{ matrix.role }}-release.apk dist/${{ matrix.name }}.apk
          printf '%s\n' 'DEMO build. Debug signing certificate. Sample balances. No live payments, blockchain, or configured authentication.' > dist/BUILD-STATUS.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: apps/devnira/dist/
          if-no-files-found: error
          retention-days: 30
