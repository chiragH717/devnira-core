name: DEVNIRA Stage2 bundle — authenticated multilevel 22PI + real FRAME batch replay (NO SETTLEMENT)
on:
  pull_request:
    paths:
      - scripts/patch_zk_v2_multilevel_authentic_22pi.py
      - scripts/patch_zk_v2_onchain_batch_admission.py
      - tests/test_zk_v2_multilevel_authentic_22pi.py
      - tests/test_zk_v2_onchain_batch_admission.py
      - .github/workflows/stage2-multilevel-and-batch.yml
      - config/upstream-pins.json
      - docs/STAGE2_MULTILEVEL_BATCH_HANDOFF.md
  push:
    branches: [main]
    paths:
      - scripts/patch_zk_v2_multilevel_authentic_22pi.py
      - scripts/patch_zk_v2_onchain_batch_admission.py
      - tests/test_zk_v2_multilevel_authentic_22pi.py
      - tests/test_zk_v2_onchain_batch_admission.py
      - .github/workflows/stage2-multilevel-and-batch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plonky2-authenticated-22pi-depth-1-2-3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Python anchored source-drift and tampering tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_zk_v2_multilevel_authentic_22pi.py' -v
          python3 -m py_compile scripts/patch_zk_v2_multilevel_authentic_22pi.py
      - name: Checkout exact pinned source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$PIN"
          git -C zk-circuits checkout --detach "$PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$PIN"
      - name: Build ONE canonical 22-PI secret/nullifier/fee/Merkle/header circuit at depths 1-3
        run: |
          set -euo pipefail
          python3 scripts/patch_zk_leaf_amount_v2.py zk-circuits
          python3 scripts/patch_zk_native_conservation.py zk-circuits
          python3 scripts/patch_zk_v2_authentic_22pi_leaf.py zk-circuits
          python3 scripts/patch_zk_v2_multilevel_authentic_22pi.py zk-circuits
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Real Plonky2 proofs reject deep sibling / position / fee / root / owner forgeries
        working-directory: zk-circuits
        run: cargo +1.93.0 test --locked -p qp-wormhole-circuit --lib dvn_v2_full_leaf_22pi_ -- --nocapture
      - name: Scope of cryptographic integration
        run: |
          echo 'Validated one authenticated canonical 22-felt native circuit at depths 1,2,3. NO full arbitrary-depth/recursion, on-chain V2 verifier, live fees, mint or mainnet.' >> "$GITHUB_STEP_SUMMARY"

  real-frame-bounded-batch-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Python batch/state invariants and source-drift tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_zk_v2_onchain_batch_admission.py' -v
          python3 -m py_compile scripts/patch_zk_v2_onchain_batch_admission.py
      - name: Checkout exact pinned real FRAME and canonical 22-PI source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/chain.git upstream
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["upstream_chain"]["sha"])')
          git -C upstream fetch --depth 1 origin "$PIN"
          git -C upstream checkout --detach "$PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          ZPIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$ZPIN"
          git -C zk-circuits checkout --detach "$ZPIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$ZPIN"
      - name: Insert canonical 22PI checks + same-block intra-batch 64-leaf no-double-spend read-only gate
        run: |
          set -euo pipefail
          python3 scripts/patch_zk_v2_onchain_preflight.py upstream --circuit-source zk-circuits
          python3 scripts/patch_zk_v2_onchain_batch_admission.py upstream
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Actual FRAME storage tests for real and duplicate 22PI nullifiers
        working-directory: upstream
        run: cargo +1.93.0 test --locked -p pallet-wormhole --lib dvn_v2_batch_ -- --nocapture
      - name: Keep settlement and payouts LOCKED
        run: |
          echo 'Real FRAME batch state admission (distinct 22-PI nullifiers, same actual historical hash, 100M cap) tested. It does NOT verify Plonky2 proof, settle, mark nullifier, pay or mint. Production V2 remains BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
