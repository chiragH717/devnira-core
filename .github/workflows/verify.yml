name: DEVNIRA reference checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python reference unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python syntax checks for wallet and reference modules
        run: python3 -m compileall -q wallet spec tests
      - name: Rust reference crate tests
        run: cargo test --manifest-path rust/tokenomics/Cargo.toml
      - name: Rust no_std DVN ZK amount reference tests
        run: cargo test --manifest-path rust/zk-amount-v2/Cargo.toml
      - name: Publish coherent DEVNIRA engineering status
        run: |
          python3 -m unittest discover -s tests -p 'test_project_status.py' -v
          python3 scripts/project_status.py | tee devnira-project-status.json
          python3 -m json.tool devnira-project-status.json >/dev/null
      - name: Upload truthful project status
        uses: actions/upload-artifact@v4
        with:
          name: devnira-project-status-not-mainnet
          path: devnira-project-status.json
          if-no-files-found: error
      - name: Validate allocation and vesting proposal
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/genesis-proposal.json').read_text())
          assert p['name']=='DEVNIRA' and p['symbol']=='DVN'
          assert p['target_block_seconds']==12
          assert p['max_supply_units']==10_000_000_000_000_000
          assert p['premine_units']==1_000_000_000_000_000
          assert p['mining_allocation_units']==9_000_000_000_000_000
          v=p['team_investor_founder_vesting']
          assert v['immediately_unlocked_units']==300_000_000_000_000
          assert v['vested_units']==700_000_000_000_000
          assert v['monthly_installment_units']*11+v['final_month_installment_units']==v['vested_units']
          assert len(v['beneficiary_addresses'])==0 and p['initial_balances']==[]
          print('Proposal arithmetic passed; actual genesis allocations NOT implemented.')
          PY
