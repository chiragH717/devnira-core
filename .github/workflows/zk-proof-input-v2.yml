name: DEVNIRA ZK V2 proof input source integration
on:
  push:
    branches: [main]
    paths:
      - scripts/patch_zk_proof_inputs_v2.py
      - scripts/patch_zk_v2_public_input_parser.py
      - scripts/patch_zk_leaf_amount_v2.py
      - scripts/patch_zk_native_hash_golden.py
      - scripts/patch_zk_native_conservation.py
      - scripts/patch_zk_v2_aggregation_amounts.py
      - tests/test_zk_native_conservation_patch.py
      - tests/test_zk_native_hash_golden_patch.py
      - tests/test_zk_leaf_amount_patch.py
      - tests/test_zk_proof_inputs_v2.py
      - tests/test_zk_v2_public_input_parser.py
      - tests/test_zk_v2_aggregation_amounts.py
      - .github/workflows/zk-proof-input-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-input-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test DVN proof input migration guards
        run: |
          python3 -m py_compile scripts/patch_zk_proof_inputs_v2.py
          python3 -m unittest discover -s tests -p 'test_zk_proof_inputs_v2.py' -v
          python3 -m unittest discover -s tests -p 'test_zk_v2_public_input_parser.py' -v
          python3 -m unittest discover -s tests -p 'test_zk_leaf_amount_patch.py' -v
          python3 -m unittest discover -s tests -p 'test_zk_native_hash_golden_patch.py' -v
          python3 -m unittest discover -s tests -p 'test_zk_native_conservation_patch.py' -v
          python3 -m unittest discover -s tests -p 'test_zk_v2_aggregation_amounts.py' -v
      - name: Clone actual upstream ZK proof source
        run: |
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$PIN"
          git -C zk-circuits checkout --detach "$PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$PIN"
          git -C zk-circuits rev-parse HEAD | tee zk-source-revision.txt
      - name: Install pinned Rust compiler before all ZK proof jobs
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Apply DVN exact amount V2 input patch
        run: python3 scripts/patch_zk_proof_inputs_v2.py zk-circuits
      - name: Inject bounded 8-decimal amount gadget into actual Plonky2 circuit source
        run: python3 scripts/patch_zk_leaf_amount_v2.py zk-circuits
      - name: Enforce Plonky2 and native FRAME Poseidon2 leaf hash equivalence
        run: python3 scripts/patch_zk_native_hash_golden.py zk-circuits
      - name: Bind native 8-decimal outputs and fees to exact proof conservation
        run: python3 scripts/patch_zk_native_conservation.py zk-circuits
      - name: Migrate opt-in public proof parser to native u64 across leaf and both aggregation layers
        run: python3 scripts/patch_zk_v2_public_input_parser.py zk-circuits
      - name: Inject native u64 guarded aggregate values and overflow-safe BPS into real aggregator source
        run: python3 scripts/patch_zk_v2_aggregation_amounts.py zk-circuits
      - name: Compile actual DVN V2 leaf amount range gadget
        working-directory: zk-circuits
        run: cargo +1.93.0 test --locked -p qp-wormhole-circuit --lib dvn_ -- --nocapture
      - name: Test modified actual wormhole public-input Rust crate
        working-directory: zk-circuits
        run: cargo +1.93.0 test --locked -p qp-wormhole-inputs --lib dvn_v2 -- --nocapture
      - name: Prove exact 8-decimal private/public aggregate and overflow-safe BPS on real Plonky2
        working-directory: zk-circuits
        run: cargo +1.93.0 test --locked -p qp-wormhole-aggregator --lib dvn_v2_ -- --nocapture
      - name: Confirm existing V1 proof fields are deliberately not migrated yet
        run: |
          grep -q 'pub input_amount: u32' zk-circuits/wormhole/inputs/src/lib.rs
          grep -q 'pub mod devnira_v2;' zk-circuits/wormhole/inputs/src/lib.rs
          grep -q 'pub mod devnira_v2_public_inputs;' zk-circuits/wormhole/inputs/src/lib.rs
          grep -q 'pub input_amount: u64' zk-circuits/wormhole/inputs/src/devnira_v2_public_inputs.rs
          grep -q 'pub mod devnira_v2_segment;' zk-circuits/wormhole/aggregator/src/lib.rs
          grep -q 'builder.range_check(final_sum, 32)' zk-circuits/wormhole/aggregator/src/private_batch/circuit/circuit_logic.rs
          echo 'Real V2 gadgets all passed. NOTE: active private/public recursion remains V1 and is NOT deployable.'
      - name: Compile opt-in V2 public input parser for wasm32/no_std
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32v1-none --toolchain 1.93.0
          cd zk-circuits
          cargo +1.93.0 check --locked -p qp-wormhole-inputs --no-default-features --target wasm32v1-none
      - name: Upload exact upstream source revision
        uses: actions/upload-artifact@v4
        with:
          name: devnira-zk-v2-inputs-source-revision
          path: zk-source-revision.txt
          if-no-files-found: error
