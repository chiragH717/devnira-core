name: DEVNIRA Stage2 genuine recursive proof bytes to FRAME verifier + WASM (NO SETTLEMENT)
on:
  pull_request:
    paths:
      - scripts/patch_zk_v2_authenticated_recursive_22pi.py
      - scripts/patch_zk_v2_frame_crypto_proof_bytes.py
      - tests/test_zk_v2_frame_crypto_proof_bytes.py
      - .github/workflows/stage2-real-proof-frame-verifier.yml
      - config/upstream-pins.json
  push:
    branches: [main]
    paths:
      - scripts/patch_zk_v2_authenticated_recursive_22pi.py
      - scripts/patch_zk_v2_frame_crypto_proof_bytes.py
      - tests/test_zk_v2_frame_crypto_proof_bytes.py
      - .github/workflows/stage2-real-proof-frame-verifier.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-shared-history-prover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed source composition, do not regenerate old unauthenticated prototype
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_zk_v2_frame_crypto_proof_bytes.py' -v
          python3 -m unittest discover -s tests -p 'test_zk_v2_authenticated_recursive_22pi.py' -v
      - name: Fetch exact immutable V2 Plonky2 circuit source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$PIN"
          git -C zk-circuits checkout --detach "$PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$PIN"
      - name: Apply one authenticated 22PI leaf twice with a shared depth16 history root
        run: |
          set -euo pipefail
          python3 scripts/patch_zk_leaf_amount_v2.py zk-circuits
          python3 scripts/patch_zk_native_conservation.py zk-circuits
          python3 scripts/patch_zk_v2_authentic_22pi_leaf.py zk-circuits
          python3 scripts/patch_zk_v2_multilevel_authentic_22pi.py zk-circuits
          python3 scripts/patch_zk_v2_authenticated_full_depth_16.py zk-circuits
          python3 scripts/patch_zk_v2_authenticated_recursive_22pi.py zk-circuits
      - name: Locked native Rust real proof proving + serialized artifacts
        working-directory: zk-circuits
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal
          export DEVNIRA_TEST_ARTIFACT_DIR="$PWD/v2-real-proof-output"
          cargo +1.93.0 test --locked -p qp-wormhole-circuit --lib dvn_v2_recursive22_ -- --nocapture
          for item in authenticated-22pi-recursive-proof.bin authenticated-22pi-recursive-vk.bin authenticated-22pi-recursive-common.bin authenticated-22pi-two-leaf-proof.bin authenticated-22pi-two-leaf-vk.bin authenticated-22pi-two-leaf-common.bin; do
            test -s "v2-real-proof-output/$item"
          done
          (cd v2-real-proof-output && sha256sum *.bin) > v2-real-proof-output/SHA256SUMS.txt
          (cd v2-real-proof-output && sha256sum -c SHA256SUMS.txt)
      - name: Upload only real test-generated serialized proofs and public development VK
        uses: actions/upload-artifact@v4
        with:
          name: devnira-22pi-recursive-REAL-PROOF-BYTES-DEV-KEYS-NOT-RELEASE
          path: zk-circuits/v2-real-proof-output/
          if-no-files-found: error

  actual-frame-cryptographic-verifier-native-wasm:
    needs: [real-shared-history-prover]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download SAME immutable-job real proof bytes, not handmade PI arrays
        uses: actions/download-artifact@v4
        with:
          name: devnira-22pi-recursive-REAL-PROOF-BYTES-DEV-KEYS-NOT-RELEASE
          path: v2-real-proof-output/
      - name: Verify real proof bytes and key SHA256 in tested branch
        run: |
          set -euo pipefail
          (cd v2-real-proof-output && sha256sum -c SHA256SUMS.txt)
          python3 -m unittest discover -s tests -p 'test_zk_v2_frame_crypto_proof_bytes.py' -v
      - name: Fetch exact unchanged FRAME native/WASM and ZK source pins
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/chain.git upstream
          CHAIN_PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["upstream_chain"]["sha"])')
          git -C upstream fetch --depth 1 origin "$CHAIN_PIN"
          git -C upstream checkout --detach "$CHAIN_PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$CHAIN_PIN"
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          ZK_PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$ZK_PIN"
          git -C zk-circuits checkout --detach "$ZK_PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$ZK_PIN"
      - name: Integrate existing isolated 8decimal runtime and live FRAME native proof compatibility test
        run: |
          set -euo pipefail
          python3 scripts/guard_dvn_network_identity.py upstream
          python3 scripts/patch_reward_runtime.py upstream
          python3 scripts/test_reward_runtime.py upstream
          python3 scripts/protect_genesis_vesting.py upstream
          python3 scripts/patch_exact_genesis_vesting.py upstream
          python3 scripts/test_exact_genesis_vesting.py upstream
          python3 scripts/test_genesis_vesting_protection.py upstream
          python3 scripts/test_onchain_vesting.py upstream
          python3 scripts/patch_isolated_dvn_8decimal_runtime.py upstream
          python3 scripts/patch_zk_v2_onchain_preflight.py upstream --circuit-source zk-circuits
          python3 scripts/patch_zk_v2_onchain_batch_admission.py upstream
          python3 scripts/patch_zk_v2_real_proof_frame_bridge.py upstream
          python3 scripts/patch_zk_v2_frame_crypto_proof_bytes.py upstream
          git -C upstream diff --stat
      - name: Install exact Rust toolchain + native/WASM compiler dependencies
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32v1-none --toolchain 1.93.0
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev cmake build-essential
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: FRAME must cryptographically verify actual recursive proof bytes, not only inputs
        working-directory: upstream
        run: |
          set -euo pipefail
          export DEVNIRA_REAL_V2_PROOF_ARTIFACT_DIR="$GITHUB_WORKSPACE/v2-real-proof-output"
          cargo +1.93.0 test --locked -p pallet-wormhole --lib dvn_v2_realproof_frame_ -- --nocapture
      - name: Same audited-pins native plus embedded WASM 8-decimal inert node build
        working-directory: upstream
        run: cargo +1.93.0 build --locked --release -p quantus-node
      - name: Verify this build is deliberately NOT a spendable release
        run: |
          set -euo pipefail
          upstream/target/release/quantus-node build-spec --chain dev --disable-default-bootnode > devnira-v2-verifier-compat-8dec-NO-SEND.json
          python3 - <<'PY'
          import json
          s=json.load(open("devnira-v2-verifier-compat-8dec-NO-SEND.json"))
          assert s["id"]=="devnira-8dec-inert-dev"
          assert s["properties"]["tokenDecimals"]==8
          assert s["properties"]["tokenSymbol"]=="DVN"
          assert s["properties"]["ss58Format"]==190
          print("Only native cryptographic compatibility verified; no active runtime V2 settlement")
          PY
      - name: Publish exact ABI evidence only, NOT mainnet/wallet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DEVNIRA-V2-FRAME-REAL-PROOF-COMPAT-NATIVE-WASM-NO-SEND
          path: devnira-v2-verifier-compat-8dec-NO-SEND.json
          if-no-files-found: error
      - name: Record remaining production blockers
        run: |
          echo 'Test-only FRAME qp-plonky2 verifier cryptographically checks SAME pinned real 24PI/46PI recursive proof bytes, canonical encoding, adversarial corruption, common finalized-history mock and replay storage. Native/WASM development node builds.' >> "$GITHUB_STEP_SUMMARY"
          echo 'NOT ACTIVATED: production approved VK, production private/public V2 batch ABI, real historical state-root finality on independent chain, atomic settlement and 8-decimal signed Send. NO MAINNET.' >> "$GITHUB_STEP_SUMMARY"
