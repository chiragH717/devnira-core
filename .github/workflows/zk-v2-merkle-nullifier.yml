name: DEVNIRA V2 cryptographic one-level Merkle/nullifier prototype (NOT ACTIVE)
on:
  pull_request:
    paths:
      - scripts/patch_zk_v2_merkle_nullifier_candidate.py
      - tests/test_zk_v2_merkle_nullifier_candidate.py
      - .github/workflows/zk-v2-merkle-nullifier.yml
      - scripts/patch_zk_leaf_amount_v2.py
      - scripts/patch_zk_native_conservation.py
  push:
    branches: [main]
    paths:
      - scripts/patch_zk_v2_merkle_nullifier_candidate.py
      - tests/test_zk_v2_merkle_nullifier_candidate.py
      - .github/workflows/zk-v2-merkle-nullifier.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-merkle-nullifier-constraints:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed source staging
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_zk_v2_merkle_nullifier_candidate.py' -v
          python3 -m py_compile scripts/patch_zk_v2_merkle_nullifier_candidate.py
      - name: Fetch exact pinned Plonky2 ZK circuit source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Quantus-Network/qp-zk-circuits.git zk-circuits
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["zk_circuits"]["sha"])')
          git -C zk-circuits fetch --depth 1 origin "$PIN"
          git -C zk-circuits checkout --detach "$PIN"
          test "$(git -C zk-circuits rev-parse HEAD)" = "$PIN"
      - name: Stage 8-decimal leaf/conservation then Merkle commitment/nullifier proof
        run: |
          set -euo pipefail
          python3 scripts/patch_zk_leaf_amount_v2.py zk-circuits
          python3 scripts/patch_zk_native_conservation.py zk-circuits
          python3 scripts/patch_zk_v2_merkle_nullifier_candidate.py zk-circuits
      - name: Install pinned Rust 1.93.0
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Prove genuine 4-ary Merkle membership and reject tampered root, sibling, nullifier and foreign chain
        working-directory: zk-circuits
        run: |
          cargo +1.93.0 test --locked -p qp-wormhole-circuit --lib dvn_v2_merkle_ -- --nocapture
      - name: Publish strictly non-production status
        run: |
          echo 'Cryptographic single-level Merkle/nullifier circuit is a development-only proof. Full-depth membership, sender authorization, V2 recursive batch integration, pinned on-chain verifier and persisted nullifiers are ABSENT.' >> "$GITHUB_STEP_SUMMARY"
