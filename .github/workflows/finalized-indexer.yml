name: DEVNIRA durable finalized SQLite explorer indexer (NO MAINNET)
on:
  pull_request:
    paths:
      - services/finalized_indexer.py
      - services/explorer_api.py
      - tests/test_finalized_indexer.py
      - tests/test_finalized_extrinsic_index.py
      - services/finalized_extrinsics.py
      - .github/workflows/finalized-indexer.yml
  push:
    branches: [main]
    paths:
      - services/finalized_indexer.py
      - services/explorer_api.py
      - tests/test_finalized_indexer.py
      - tests/test_finalized_extrinsic_index.py
      - services/finalized_extrinsics.py
      - .github/workflows/finalized-indexer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sqlite-finality-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test persistent SQLite checkpoint, fail-closed finality, atomic rollback and local API
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_finalized_indexer.py' -v
          python3 -m unittest discover -s tests -p 'test_finalized_extrinsic_index.py' -v
          python3 -m unittest discover -s tests -p 'test_public_product_candidates.py' -v
          python3 -m py_compile services/finalized_indexer.py services/finalized_extrinsics.py services/explorer_api.py
      - name: Confirm no false production claims
        run: |
          grep -q '"mainnet_ready":False' services/finalized_indexer.py
          grep -q 'transactions_decoded":False' services/finalized_indexer.py
          echo 'SQLite finalized-block indexing and on-disk negative tests work. This is NOT a production explorer, node consensus proof, wallet or live blockchain.' >> "$GITHUB_STEP_SUMMARY"
