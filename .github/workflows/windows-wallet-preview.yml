name: DEVNIRA Windows receive and offline company wallet setup
on:
  push:
    branches: [main]
    paths:
      - wallet/**
      - spec/ss58_company_account.py
      - tests/test_wallet_balance.py
      - tests/test_wallet_rpc_diagnostics.py
      - tests/test_windows_company_wallet.py
      - spec/verify_company_custody.py
      - tests/test_network_identity.py
      - docs/WINDOWS_NATIVE_COMPANY_BUILD.md
      - .github/workflows/windows-wallet-preview.yml
  pull_request:
    paths:
      - wallet/**
      - spec/ss58_company_account.py
      - spec/verify_company_custody.py
      - tests/test_windows_company_wallet.py
      - tests/test_network_identity.py
      - .github/workflows/windows-wallet-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-readonly-wallet:
    name: Test DVN offline company ownership wizard and build Windows EXE (NO SEND)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows account + network validation tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_wallet_balance.py" -v
          python -m unittest discover -s tests -p "test_wallet_rpc_diagnostics.py" -v
          python -m unittest discover -s tests -p "test_network_identity.py" -v
          python -m unittest discover -s tests -p "test_ss58_company_account.py" -v
          python -m unittest discover -s tests -p "test_windows_company_wallet.py" -v
          python -m compileall -q wallet spec
      - name: Package preview executable — NEVER a signing wallet
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name DEVNIRA-Company-Wallet-Setup-NO-SEND wallet/devnira_windows.py
          if (-not (Test-Path 'dist/DEVNIRA-Company-Wallet-Setup-NO-SEND.exe')) { throw 'Missing compiled EXE' }
      - name: Record built executable digest
        shell: pwsh
        run: |
          Get-FileHash 'dist/DEVNIRA-Company-Wallet-Setup-NO-SEND.exe' -Algorithm SHA256 |
            Format-List | Out-File -Encoding utf8 'devnira-windows-readonly-sha256.txt'
          Get-Content 'devnira-windows-readonly-sha256.txt'
      - name: Upload pre-release wallet preview and digest
        uses: actions/upload-artifact@v4
        with:
          name: DEVNIRA-Windows-Offline-Company-Setup-and-Balance-NO-SEND-NOT-MAINNET
          path: |
            dist/DEVNIRA-Company-Wallet-Setup-NO-SEND.exe
            devnira-windows-readonly-sha256.txt
          if-no-files-found: error
      - name: Explicit release disclaimer
        shell: pwsh
        run: |
          "Windows executable includes offline owner-operated native CLI hash pinning, challenge/certificate verification, public receiving-account and finalized balance preview." >> $env:GITHUB_STEP_SUMMARY
          "NO private-key storage, signed send, independent DVN genesis, working ZK withdrawals or GPU-mining release." >> $env:GITHUB_STEP_SUMMARY
