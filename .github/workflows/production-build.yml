name: DEVNIRA production preflight and build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Require verified whole-product release evidence manifest
        run: |
          set -euo pipefail
          test -f config/release-evidence.json || {
            echo "STOP: independent mainnet, wallets, miners, explorer, pool, website and security evidence not supplied."
            exit 1
          }
          python3 scripts/release_evidence_gate.py config/release-evidence.json
      - name: Checkout pinned upstream source (never moving HEAD)
        run: |
          set -euo pipefail
          PIN=$(python3 -c 'import json;print(json.load(open("config/upstream-pins.json"))["upstream_chain"]["sha"])')
          git clone --depth 1 https://github.com/Quantus-Network/chain.git upstream
          git -C upstream fetch --depth 1 origin "$PIN"
          git -C upstream checkout --detach "$PIN"
          test "$(git -C upstream rev-parse HEAD)" = "$PIN"
      - name: Record exact source revision
        run: git -C upstream rev-parse HEAD
      - name: Apply DEVNIRA candidate identity patch
        run: python3 scripts/prepare_upstream.py upstream
      - name: Explicitly reject production build when company address/genesis is pending
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path("config/genesis-proposal.json").read_text())
          if not g["company_treasury"]["public_address"] or not g["genesis_timestamp_ms"]:
              raise SystemExit("STOP: verified company public address and actual genesis timestamp are required")
          PY
      - name: STOP if runtime economics and ZK amount encoding are not actually integrated
        run: python3 scripts/audit_production_runtime.py upstream
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup target add wasm32v1-none --toolchain 1.93.0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev cmake build-essential
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Compile native and WASM runtime
        working-directory: upstream
        run: cargo +1.93.0 build --release --locked -p quantus-node
      - name: Validate independent mainnet genesis
        run: |
          upstream/target/release/quantus-node build-spec --chain devnira-mainnet --disable-default-bootnode > devnira-mainnet.json
          python3 -m json.tool devnira-mainnet.json >/dev/null
      - name: Upload release candidate chain spec
        uses: actions/upload-artifact@v4
        with:
          name: devnira-mainnet-preflight-artifacts
          path: devnira-mainnet.json
          if-no-files-found: error
